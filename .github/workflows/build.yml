name: Build RSSVibes

# Builds self-contained executables (no Python needed to run them):
#   - Windows:  RSSVibes.exe            (PyInstaller one-file)
#   - Linux:    RSSVibes-x86_64.AppImage
# Runs on a version tag (attaches to the matching Release) or on demand
# (uploads workflow artifacts you can download from the run).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install pyinstaller pillow
      - name: Generate icon
        run: python packaging/make_icon.py
      - name: Build RSSVibes.exe
        run: pyinstaller --onefile --noconsole --name RSSVibes --icon rssvibes.ico --add-data "web;web" server.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSSVibes-windows-exe
          path: dist/RSSVibes.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RSSVibes.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          pip install pyinstaller pillow
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
      - name: Generate icon
        run: python packaging/make_icon.py
      - name: Build self-contained binary
        run: pyinstaller --onefile --name RSSVibes --add-data "web:web" server.py
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/RSSVibes AppDir/usr/bin/RSSVibes
          cp rssvibes.png AppDir/rssvibes.png
          cp rssvibes.png AppDir/usr/share/icons/hicolor/256x256/apps/rssvibes.png
          cp packaging/rssvibes.desktop AppDir/rssvibes.desktop
          cp packaging/rssvibes.desktop AppDir/usr/share/applications/rssvibes.desktop
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/RSSVibes
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir RSSVibes-x86_64.AppImage
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSSVibes-linux-appimage
          path: RSSVibes-x86_64.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RSSVibes-x86_64.AppImage
