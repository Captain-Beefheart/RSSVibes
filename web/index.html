<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSSVibes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◧</span>
      <span class="brand-name" id="brandName">RSSVibes</span>
    </div>

    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <button class="tab-add" id="addTabBtn" title="New page">＋</button>

    <div class="topbar-spacer"></div>

    <button class="btn" id="riverBtn" title="River of News — every feed in one stream">≋ River</button>
    <button class="btn" id="addWidgetBtn" title="Add a widget">＋ Widget</button>
    <button class="btn" id="addFeedBtn" title="Add an RSS feed">＋ Feed</button>
    <button class="btn icon" id="refreshAllBtn" title="Refresh all feeds">⟳</button>
    <button class="btn icon" id="settingsBtn" title="Settings">⚙</button>
    <button class="btn icon danger" id="quitBtn" title="Stop the RSSVibes server">⏻</button>
  </header>

  <!-- Dashboard columns -->
  <main class="board" id="board"></main>

  <!-- River of News: every feed merged into one chronological stream -->
  <section class="river" id="river" hidden>
    <div class="river-head">
      <div class="river-title">≋ River of News <span class="river-sub" id="riverSub"></span></div>
      <div class="river-actions">
        <button class="btn icon" id="riverRefresh" title="Refresh all feeds">⟳</button>
        <button class="btn" id="riverClose">✕ Close</button>
      </div>
    </div>
    <div class="river-body" id="riverBody"></div>
  </section>

  <!-- Reader pane (article view) -->
  <aside class="reader" id="reader" hidden>
    <div class="reader-head">
      <button class="btn icon" id="readerClose" title="Close">✕</button>
      <a class="btn" id="readerOpen" target="_blank" rel="noopener noreferrer">Open original ↗</a>
    </div>
    <article class="reader-body" id="readerBody"></article>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Generic modal -->
  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <template id="widgetTpl">
    <section class="widget" draggable="true">
      <header class="widget-head">
        <span class="widget-grip" title="Drag to move">⠿</span>
        <span class="widget-title"></span>
        <span class="widget-count"></span>
        <span class="widget-actions">
          <button class="wbtn act-refresh" title="Refresh">⟳</button>
          <button class="wbtn act-collapse" title="Collapse">▾</button>
          <button class="wbtn act-config" title="Settings">⚙</button>
          <button class="wbtn act-remove" title="Remove">✕</button>
        </span>
      </header>
      <div class="widget-body"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
